apiVersion: apps/v1
kind: Deployment
metadata:
  name: f1-site
spec:
  replicas: 1
  selector:
    matchLabels:
      app: f1-site
  template:
    metadata:
      labels:
        app: f1-site
    spec:
      containers:
      - name: f1-site
        image: shahid1r/f1-site:latest
        ports:
        - containerPort: 80